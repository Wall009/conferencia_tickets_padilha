<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conferência de Tickets</title><link rel="stylesheet" href="estilo.css"></head><body>
<header><strong>Conferência de Tickets</strong><button id="sair" hidden>Sair</button></header>
<main>
<form id="login" hidden><label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password" required><button>Entrar</button><p id="erroLogin" class="msg"></p></form>
<div id="app" hidden>
 <nav id="abas" hidden><button data-aba="bipar" class="ativa">Bipar</button><button data-aba="painel">Painel</button></nav>
 <section id="bipar" hidden>
  <div id="visor"><video id="video" playsinline muted></video><div id="mira"></div></div>
  <button id="camera" class="grande">Ligar câmera</button>
  <div id="resultado" role="status">Ligue a câmera e aponte para o QR.</div>
  <p>Lidos nesta sessão: <b id="contador">0</b></p>
  <details><summary>QR não lê? Digitar o código</summary><form id="manual"><input id="codigo" autocapitalize="characters" autocomplete="off" placeholder="Código do voucher"><button>Conferir</button></form></details>
 </section>
 <section id="painel" hidden>
  <p id="status" class="msg"></p>
  <div id="importar" hidden><label for="arquivo">Importar planilha (.xlsx)</label><input id="arquivo" type="file" accept=".xlsx"><p id="msgImp" class="msg"></p></div>
  <div class="filtro"><label>Uso desde<input type="date" id="desde"></label><label>até<input type="date" id="ate"></label></div>
  <button id="exportar" hidden>Exportar Excel</button>
  <div class="cartoes"><div><b id="tOk">0</b>Conferidos</div><div><b id="tPend">0</b>Pendentes</div><div class="alerta"><b id="tDiv">0</b>Divergências</div></div>
  <h2>Divergências <small>(todas as datas)</small></h2><div id="divs"></div>
  <h2>Por cliente e pedido</h2><input id="busca" placeholder="Buscar cliente"><div id="grupos"></div>
  <h2>Últimas leituras</h2><div id="ultimas"></div>
 </section>
</div></main><script src="jsqr.js"></script><script src="app.js"></script></body></html>
